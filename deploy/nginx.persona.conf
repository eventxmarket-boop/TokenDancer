server {
    listen 80;
    server_name tokendancer.com;

    root /var/www/tokendancer;
    index index.html;

    location = /persona {
        return 301 /persona/;
    }

    location /persona/ {
        try_files $uri $uri/ /persona/index.html;
    }

    location = /persona-api {
        return 301 /persona-api/;
    }

    location /persona-api/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name tokendancer.xyz;

    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name app.tokendancer.xyz;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tokendancer.xyz;

    root /var/www/tokendancer;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/tokendancer.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tokendancer.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = / {
        return 301 /persona/;
    }

    location = /persona {
        return 301 /persona/;
    }

    location /persona/ {
        try_files $uri $uri/ /persona/index.html;
    }

    location = /persona-api {
